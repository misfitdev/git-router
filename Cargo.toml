[package]
name = "git-router"
version = "0.1.0"
edition = "2021"
description = "Route SSH keys and HTTPS credentials by org/namespace in git remote URLs"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"

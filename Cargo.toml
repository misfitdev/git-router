[package]
name = "git-router"
version = "0.0.0-dev"
edition = "2024"
description = "Route SSH keys, HTTPS credentials, and committer identity by org/namespace in git remote URLs"
license = "MIT"
repository = "https://github.com/misfitdev/git-router"
homepage = "https://github.com/misfitdev/git-router"
keywords = ["git", "ssh", "credential", "routing"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
opt-level = "z"

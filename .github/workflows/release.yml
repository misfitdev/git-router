name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v6

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../git-router-${{ matrix.target }}.tar.gz git-router
          cd ../../..

      - uses: actions/upload-artifact@v6
        with:
          name: git-router-${{ matrix.target }}
          path: git-router-${{ matrix.target }}.tar.gz

  attest:
    name: Attest
    needs: build
    permissions:
      id-token: write
      attestations: write
      contents: read
    uses: misfitdev/.github/.github/workflows/attest.yml@main
    with:
      subject-path: "artifacts/*.tar.gz"

  verify:
    name: Verify
    needs: attest
    permissions: {}
    uses: misfitdev/.github/.github/workflows/verify.yml@main
    with:
      artifact-path: "artifacts/*.tar.gz"

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum git-router-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            artifacts/*

  publish-crate:
    name: Publish to crates.io
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  update-homebrew:
    name: Update Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Compute checksums
        id: shas
        run: |
          echo "darwin_arm64=$(sha256sum artifacts/git-router-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_x86_64=$(sha256sum artifacts/git-router-x86_64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_x86_64=$(sha256sum artifacts/git-router-x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum artifacts/git-router-aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: misfitdev/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_DARWIN_ARM64: ${{ steps.shas.outputs.darwin_arm64 }}
          SHA_DARWIN_X86_64: ${{ steps.shas.outputs.darwin_x86_64 }}
          SHA_LINUX_X86_64: ${{ steps.shas.outputs.linux_x86_64 }}
          SHA_LINUX_ARM64: ${{ steps.shas.outputs.linux_arm64 }}
        run: |
          mkdir -p tap/Formula
          VERSION_BARE="${VERSION#v}"
          cat > tap/Formula/git-router.rb << FORMULA
          class GitRouter < Formula
            desc "Route SSH keys and HTTPS credentials by org/namespace in git remote URLs"
            homepage "https://github.com/misfitdev/git-router"
            version "${VERSION_BARE}"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/misfitdev/git-router/releases/download/${VERSION}/git-router-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_ARM64}"
              else
                url "https://github.com/misfitdev/git-router/releases/download/${VERSION}/git-router-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_DARWIN_X86_64}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/misfitdev/git-router/releases/download/${VERSION}/git-router-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM64}"
              else
                url "https://github.com/misfitdev/git-router/releases/download/${VERSION}/git-router-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_X86_64}"
              end
            end

            def install
              bin.install "git-router"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/git-router --version")
            end
          end
          FORMULA
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' tap/Formula/git-router.rb

      - name: Push formula
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/git-router.rb
          git commit -m "git-router ${{ github.ref_name }}"
          git push
